<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>zabolotAI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span class="name">zabolotAI</span>
        <span class="model" id="model-badge">minimax-m2.5</span>
      </div>
      <button class="btn-ghost" id="reset-btn" title="Очистить чат">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
      </button>
    </header>

    <main id="messages" class="messages">
      <div class="hint" id="welcome">
        <h1>Привет 👋</h1>
        <p>Напиши вопрос или прикрепи фото — отвечу с помощью нейросети.</p>
      </div>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <label class="attach" id="attach-label" title="Прикрепить фото">
        <input type="file" id="file-input" accept="image/*" hidden />
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
      </label>
      <div class="input-wrap">
        <div id="preview" class="preview" hidden>
          <img id="preview-img" alt="" />
          <button type="button" id="preview-remove" aria-label="Убрать фото">×</button>
        </div>
        <textarea
          id="input"
          rows="1"
          placeholder="Спроси что-нибудь…"
          maxlength="4000"
        ></textarea>
      </div>
      <button id="send-btn" class="btn-send" type="submit" aria-label="Отправить">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </form>

    <script src="/static/app.js"></script>
  </body>
</html>
