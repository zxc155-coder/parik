<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>zabolotAI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="logo">zA</div>
        <div class="brand-text">
          <div class="brand-name">zabolotAI</div>
          <button id="model-pill" class="model-pill" type="button" aria-haspopup="true" aria-expanded="false">
            <span id="model-pill-label">…</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </div>
      </div>
      <button class="icon-btn" id="reset-btn" title="Очистить чат" aria-label="Очистить чат">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
      </button>
    </header>

    <main id="messages" class="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-hero">
          <div class="welcome-logo">zA</div>
          <div class="welcome-glow"></div>
        </div>
        <h1 class="welcome-title">
          <span class="grad-text">zabolotAI</span>
        </h1>
        <p class="welcome-sub">Умный ассистент в Telegram. Чат, фото и более 20 нейросетей на выбор.</p>
        <div class="quick-actions" id="quick-actions">
          <button type="button" class="chip" data-prompt="Объясни простыми словами что такое квантовая запутанность">🔬 Что такое квантовая запутанность?</button>
          <button type="button" class="chip" data-prompt="Напиши короткое стихотворение про осень в стиле Есенина">🍂 Стихи про осень</button>
          <button type="button" class="chip" data-prompt="Дай 5 идей для здорового и сытного завтрака">🥗 Идеи для завтрака</button>
          <button type="button" class="chip" data-prompt="Помоги составить план тренировки на неделю для новичка">💪 План тренировок</button>
          <button type="button" class="chip" data-prompt="Объясни простыми словами как работает блокчейн">⛓️ Как работает блокчейн?</button>
          <button type="button" class="chip" data-prompt="Дай советы как лучше учить английский с нуля">🇬🇧 Учить английский</button>
        </div>
      </div>
    </main>
    <button id="scroll-bottom" class="scroll-bottom" type="button" aria-label="К новым сообщениям" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>

    <form id="composer" class="composer" autocomplete="off">
      <label class="attach-btn" id="attach-label" title="Прикрепить фото" aria-label="Прикрепить фото">
        <input type="file" id="file-input" accept="image/*" hidden />
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
      </label>
      <div class="input-wrap">
        <div id="preview" class="preview" hidden>
          <img id="preview-img" alt="" />
          <button type="button" id="preview-remove" aria-label="Убрать фото">×</button>
        </div>
        <textarea
          id="input"
          rows="1"
          placeholder="Спроси что-нибудь…"
          maxlength="4000"
        ></textarea>
      </div>
      <button id="send-btn" class="send-btn" type="submit" aria-label="Отправить">
        <svg class="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        <svg class="spinner-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9" opacity="0.25"></circle><path d="M21 12a9 9 0 0 1-9 9"></path></svg>
      </button>
    </form>

    <div id="model-sheet" class="sheet" hidden role="dialog" aria-label="Выбор модели" aria-modal="true">
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet-panel" role="document">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <div class="sheet-titles">
            <h2>Нейросети</h2>
            <p id="model-count" class="sheet-sub"></p>
          </div>
          <button class="icon-btn" data-close aria-label="Закрыть">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="sheet-search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="model-search" type="search" placeholder="Поиск модели…" autocomplete="off" />
        </div>
        <div class="sheet-tabs" id="model-tabs">
          <button type="button" class="tab active" data-filter="all">Все</button>
          <button type="button" class="tab" data-filter="canopywave">Canopy</button>
          <button type="button" class="tab" data-filter="openrouter">OpenRouter</button>
          <button type="button" class="tab" data-filter="free">Бесплатные</button>
          <button type="button" class="tab" data-filter="reasoning">Reasoning</button>
          <button type="button" class="tab" data-filter="fast">Быстрые</button>
        </div>
        <div class="sheet-body" id="model-list"></div>
        <div class="sheet-empty" id="model-empty" hidden>Ничего не нашлось</div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
